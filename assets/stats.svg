<text x="584" y="108" class="l">Issues</text>
<text x="24" y="150" class="l">Most used languages</text>
<clipPath id="bar"><rect x="24" y="162" width="672" height="10" rx="5"/></clipPath>
<g clip-path="url(#bar)">
<rect x="24.00" y="162" width="583.53" height="10" fill="#3572A5"/>
<rect x="607.53" y="162" width="68.20" height="10" fill="#f34b7d"/>
